name: build-macos

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-macos-v1

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          GODOT_APP="$HOME/godot-bin/Godot.app/Contents/MacOS/Godot"
          if [ ! -x "$GODOT_APP" ]; then
            curl -fL --retry 4 --retry-delay 5 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
            mkdir -p "$HOME/godot-bin"
            ditto -x -k /tmp/godot.zip "$HOME/godot-bin"
          fi
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TPL_DIR/macos.zip" ]; then
            curl -fL --retry 4 --retry-delay 5 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            rm -rf /tmp/godot-templates
            unzip -q /tmp/templates.tpz -d /tmp/godot-templates
            mkdir -p "$TPL_DIR"
            mv /tmp/godot-templates/templates/* "$TPL_DIR/"
          fi
          "$GODOT_APP" --version

      - name: Import project (headless)
        run: |
          GODOT="$HOME/godot-bin/Godot.app/Contents/MacOS/Godot"
          # First import on a cold cache can exit non-zero; run it twice.
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import

      - name: Export macOS app
        run: |
          set -euo pipefail
          GODOT="$HOME/godot-bin/Godot.app/Contents/MacOS/Godot"
          mkdir -p build
          "$GODOT" --headless --path . --export-release "macOS" "$PWD/build/TwoMicroseconds.zip" 2>&1 | tee build/export.log
          # Godot can exit 0 even when the export failed; gate on the output.
          test -s build/TwoMicroseconds.zip
          if grep -Eq "ERROR: Project export|Failed to export" build/export.log; then
            echo "Export log contains errors" >&2
            exit 1
          fi

      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          ditto -x -k build/TwoMicroseconds.zip build/unpacked
          APP="$(find build/unpacked -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Expected to be rejected (no notarization) — logged for reference only.
          spctl --assess -vv "$APP" || true
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Smoke test (headless boot of the exported game)
        run: |
          set -euo pipefail
          BIN="$(find "$APP_PATH/Contents/MacOS" -type f -perm +111 -print -quit)"
          test -n "$BIN"
          # --smoke (after --) makes the game skip the title screen and start
          # a real run, so muon/props/HUD scripts all load and tick.
          "$BIN" --headless --quit-after 240 -- --smoke 2>&1 | tee build/smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" build/smoke.log; then
            echo "Smoke test found script errors" >&2
            exit 1
          fi

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p build/dmg-root
          ditto "$APP_PATH" "build/dmg-root/$(basename "$APP_PATH")"
          cp dist/RUN_ME_FIRST.txt "build/dmg-root/RUN ME FIRST.txt"
          # Classic drag-to-install: a link to /Applications inside the DMG.
          ln -s /Applications build/dmg-root/Applications
          for attempt in 1 2 3; do
            if hdiutil create -volname "Two Microseconds" -srcfolder build/dmg-root \
                -ov -format UDZO "build/TwoMicroseconds-macOS.dmg"; then
              break
            fi
            echo "hdiutil attempt $attempt failed, retrying..." >&2
            sleep 5
          done
          hdiutil verify build/TwoMicroseconds-macOS.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwoMicroseconds-macOS
          path: build/TwoMicroseconds-macOS.dmg
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore

  # Visual feedback loop: run the game under Xvfb, let the shot director
  # drive it through scripted moments, and upload the PNGs.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot (linux)
        uses: actions/cache@v4
        with:
          path: ~/godot-linux
          key: godot-${{ env.GODOT_VERSION }}-linux-v1

      - name: Install Godot
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/godot-linux/godot" ]; then
            curl -fL --retry 4 --retry-delay 5 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            mkdir -p "$HOME/godot-linux"
            unzip -q /tmp/godot.zip -d "$HOME/godot-linux"
            mv "$HOME/godot-linux/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-linux/godot"
          fi
          "$HOME/godot-linux/godot" --version

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-vulkan-drivers libegl1 libgl1 mesa-utils

      - name: Import project (headless)
        run: |
          "$HOME/godot-linux/godot" --headless --path . --import || true
          "$HOME/godot-linux/godot" --headless --path . --import

      - name: Run shot director
        run: |
          set -euo pipefail
          timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" \
            "$HOME/godot-linux/godot" --path . \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            -- --shoot 2>&1 | tee shoot.log || true
          SHOTS_DIR="$HOME/.local/share/godot/app_userdata/Two Microseconds/shots"
          ls -la "$SHOTS_DIR"
          test -n "$(ls "$SHOTS_DIR"/*.png 2>/dev/null)"
          mkdir -p out && cp "$SHOTS_DIR"/*.png out/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/*.png
          retention-days: 14

      - name: Upload shoot log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shoot-log
          path: shoot.log
          if-no-files-found: ignore

  # Playable web build on GitHub Pages. Single-threaded export: Pages can't
  # serve the COOP/COEP headers SharedArrayBuffer would need.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot (linux + templates)
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-linux
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-web-v1

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/godot-linux/godot" ]; then
            curl -fL --retry 4 --retry-delay 5 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            mkdir -p "$HOME/godot-linux"
            unzip -q /tmp/godot.zip -d "$HOME/godot-linux"
            mv "$HOME/godot-linux/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-linux/godot"
          fi
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TPL_DIR/web_nothreads_release.zip" ]; then
            curl -fL --retry 4 --retry-delay 5 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            rm -rf /tmp/godot-templates
            unzip -q /tmp/templates.tpz -d /tmp/godot-templates
            mkdir -p "$TPL_DIR"
            mv /tmp/godot-templates/templates/* "$TPL_DIR/"
          fi
          "$HOME/godot-linux/godot" --version

      - name: Import project (headless)
        run: |
          "$HOME/godot-linux/godot" --headless --path . --import || true
          "$HOME/godot-linux/godot" --headless --path . --import

      - name: Export Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          "$HOME/godot-linux/godot" --headless --path . --export-release "Web" \
            "$PWD/build/web/index.html" 2>&1 | tee build/export-web.log
          test -s build/web/index.html
          test -s build/web/index.wasm
          if grep -Eq "ERROR: Project export|Failed to export" build/export-web.log; then
            echo "Web export log contains errors" >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
